name: Gateways production readiness checks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gateways-production-check.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check public pages and protected API on production
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,time,sys
          base="https://www.bimlabsstudio.com"
          failed=[]
          def request(path,method="GET"):
              req=urllib.request.Request(base+path,method=method,headers={"User-Agent":"Gateways-Production-Verification"})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r: return r.status,r.read(100000)
              except urllib.error.HTTPError as e:return e.code,e.read(100000)
          for i in range(10):
              s,b=request("/api/gateways/health")
              print("DB health attempt",i+1,"status",s)
              if s==200:
                  try:
                      if json.loads(b).get("ok") is True:break
                  except:pass
              time.sleep(5)
          else:failed.append("Database not ready")
          for path in ("/gateways.html","/gateways-kitchen.html","/gateways-live.bundle.js","/gateways-live.css"):
              s,b=request(path);print("Page",path,s,len(b))
              if s!=200:failed.append(path+" not available")
              if path=="/gateways.html" and b"gateways-live.bundle.js" not in b:failed.append("Student page missing bundle")
          for path in ("/api/gateways/me","/api/gateways/pass","/api/gateways/roster","/api/gateways/stats"):
              s,b=request(path);print("Unauthenticated",path,s)
              if s!=401:failed.append(path+" did not reject anonymous access")
          s,b=request("/.netlify/identity/settings")
          try:
              settings=json.loads(b)
              print("Identity settings HTTP",s,"disable_signup",settings.get("disable_signup"),"email_provider",settings.get("external",{}).get("email"))
              if s!=200 or settings.get("disable_signup") is not False:failed.append("Self-registration not enabled")
          except:failed.append("Identity settings unavailable")
          s,b=request("/")
          print("Homepage",s,"Identity redirect present",b"location.replace('/gateways.html' + location.hash)" in b)
          if s!=200 or b"location.replace('/gateways.html' + location.hash)" not in b:failed.append("Confirmation redirect missing")
          if failed:
              print("FAILURES:",failed)
              sys.exit(1)
          print("Gateways production deployment, DB and anonymous access tests PASSED")
          PY
