name: Gateways Identity signup readiness
on:
  push:
    branches: [gateways/netlify-secure-backend]
    paths: ['.github/workflows/gateways-identity-check.yml', 'gateways-live.mjs', 'netlify/functions/gateways-api.mjs']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Identity settings available publicly
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          for host in ("https://deploy-preview-74--bimlab.netlify.app", "https://www.bimlabsstudio.com"):
              url=host+"/.netlify/identity/settings"
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Gateways-Readiness-Check"}), timeout=12) as response:
                      data=response.read(65536)
                      print(host, "identity-settings HTTP", response.status, "type", response.headers.get("content-type"), "starts_html", data.lstrip()[:25].lower().startswith(b"<!doctype html") or data.lstrip()[:6].lower().startswith(b"<html"))
                  try:
                      value=json.loads(data)
                      print("  signup: disable_signup =",value.get("disable_signup"),"; autoconfirm =",value.get("mailer_autoconfirm"),"; external =",str(value.get("external",{}).get("email")) if isinstance(value.get("external"),dict) else type(value.get("external")).__name__)
                      print("  keys:",sorted(k for k in value if k in {"disable_signup","mailer_autoconfirm","external","site_url","error","msg"}))
                  except Exception as error:
                      print("  Could not interpret settings",type(error).__name__)
              except urllib.error.HTTPError as error:
                  print(host, "identity-settings HTTP",error.code)
              except Exception as error:
                  print(host, "identity-settings: unavailable",type(error).__name__)
          PY
