name: Gateways backend build check
on:
  pull_request:
    paths:
      - 'gateways-live.*'
      - 'netlify/**'
      - 'package.json'
      - 'netlify.toml'
      - '.github/workflows/gateways-build.yml'
  push:
    branches:
      - gateways/netlify-secure-backend
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Bundle student and staff app
        run: npm run build
      - name: Validate source syntax
        run: |
          node --check gateways-live.mjs
          node --check netlify/functions/gateways-api.mjs
          node --check netlify/lib/gateways-security.mjs
