<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Bella ❤️</title>
<meta name="theme-color" content="#f5e9e6">

<style>
:root{
  --rose:#a64f5f;
  --ink:#2a1f1c;
  --muted:#7b625d;
}

*{box-sizing:border-box}

html,body{
  min-height:100%;
  margin:0;
}

body{
  display:grid;
  place-items:center;
  padding:24px;
  overflow:hidden;
  color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.95),transparent 34%),
    radial-gradient(circle at 82% 82%,rgba(166,79,95,.12),transparent 34%),
    linear-gradient(135deg,#f8f0ec,#ead9d5);
}

body::before,
body::after{
  content:"";
  position:fixed;
  border:1px solid rgba(166,79,95,.15);
  border-radius:50%;
  pointer-events:none;
}

body::before{
  width:30rem;
  height:30rem;
  top:-20rem;
  left:-18rem;
}

body::after{
  width:28rem;
  height:28rem;
  right:-19rem;
  bottom:-20rem;
}

.card{
  width:min(92vw,700px);
  padding:clamp(32px,6vw,58px);
  text-align:center;
  border:1px solid rgba(65,39,36,.09);
  border-radius:30px;
  background:rgba(255,250,247,.88);
  box-shadow:0 30px 90px rgba(73,42,39,.15);
  backdrop-filter:blur(18px);
}

.eyebrow{
  margin:0 0 16px;
  color:var(--muted);
  font:700 11px/1.4 Arial,Helvetica,sans-serif;
  letter-spacing:.24em;
  text-transform:uppercase;
}

h1{
  margin:0;
  font-size:clamp(54px,10vw,92px);
  line-height:.9;
  font-weight:400;
  letter-spacing:-.04em;
}

h1 span{
  display:block;
  margin-top:17px;
  color:var(--rose);
  font-size:.46em;
  line-height:1;
  font-style:italic;
  letter-spacing:-.02em;
}

.message{
  max-width:500px;
  margin:25px auto 30px;
  color:#66514c;
  font:16px/1.7 Arial,Helvetica,sans-serif;
}

.qr-shell{
  width:228px;
  height:228px;
  margin:0 auto;
  padding:14px;
  display:grid;
  place-items:center;
  border-radius:24px;
  background:#fff;
  box-shadow:0 16px 40px rgba(66,43,40,.13);
}

.qr-shell img{
  width:200px;
  height:200px;
  display:block;
}

.hint{
  margin:21px 0 0;
  color:#8b6f69;
  font:700 11px/1.4 Arial,Helvetica,sans-serif;
  letter-spacing:.13em;
  text-transform:uppercase;
}

.tap{
  display:inline-block;
  margin-top:16px;
  color:var(--rose);
  text-decoration:none;
  font:500 14px Arial,Helvetica,sans-serif;
  border-bottom:1px solid currentColor;
  padding-bottom:3px;
}

@media (max-width:520px){
  .card{
    padding:34px 22px;
    border-radius:24px;
  }

  .qr-shell{
    width:210px;
    height:210px;
  }

  .qr-shell img{
    width:182px;
    height:182px;
  }
}
</style>
</head>

<body>
<main class="card">
  <p class="eyebrow">A little morning surprise</p>

  <h1>
    Bella
    <span>this is for you</span>
  </h1>

  <p class="message">
    Three years, eleven months, and still my favorite person.
    Scan this when you’re ready to read what my heart has been trying to say.
  </p>
