<section><h2>Pick your flag</h2><button class="flag-button" type="button" id="pick">🌍 Choose your country or territory</button></section>
<button type="submit" id="submit">Submit my vote</button><p id="message" role="status"></p></form>
<section id="results" hidden><h2>Poll results</h2><p id="totals"></p><p id="countries"></p><button class="flag-button" type="button" id="refresh">Refresh results</button></section>
</main><dialog id="picker" aria-labelledby="pickerTitle"><header><h2 id="pickerTitle">Pick your flag</h2><button type="button" id="close" aria-label="Close country picker">✕</button></header><label class="field">Search countries and territories<input type="search" id="search" placeholder="Type a name" autocomplete="off"></label><div class="country-list" id="list"></div></dialog>
<script>
const el=id=>document.getElementById(id);
const names=new Intl.DisplayNames(["en"],{type:"region"});
const flagImage=code=>"https://flagcdn.com/w160/"+code.toLowerCase()+".png";
const flag=code=>String.fromCodePoint(...Array.from(code,char=>127397+char.charCodeAt(0)));
const countries=["AW","AF","AO","AI","AX","AL","AD","AE","AR","AM","AS","AQ","TF","AG","AU","AT","AZ","BI","BE","BJ","BQ","BF","BD","BG","BH","BS","BA","BL","BY","BZ","BM","BO","BR","BB","BN","BT","BV","BW","CF","CA","CC","CH","CL","CN","CI","CM","CD","CG","CK","CO","KM","CV","CR","CU","CW","CX","KY","CY","CZ","DE","DJ","DM","DK","DO","DZ","EC","EG","ER","EH","ES","EE","ET","FI","FJ","FK","FR","FO","FM","GA","GB","GE","GG","GH","GI","GN","GP","GM","GW","GQ","GR","GD","GL","GT","GF","GU","GY","HK","HM","HN","HR","HT","HU","ID","IM","IN","IO","IE","IR","IQ","IS","IL","IT","JM","JE","JO","JP","KZ","KE","KG","KH","KI","KN","KR","KW","LA","LB","LR","LY","LC","LI","LK","LS","LT","LU","LV","MO","MF","MA","MC","MD","MG","MV","MX","MH","MK","ML","MT","MM","ME","MN","MP","MZ","MR","MS","MQ","MU","MW","MY","YT","NA","NC","NE","NF","NG","NI","NU","NL","NO","NP","NR","NZ","OM","PK","PA","PN","PE","PH","PW","PG","PL","PR","KP","PT","PY","PS","PF","QA","RE","RO","RU","RW","SA","SD","SN","SG","GS","SH","SJ","SB","SL","SV","SM","SO","PM","RS","SS","ST","SR","SK","SI","SE","SZ","SX","SC","SY","TC","TD","TG","TH","TJ","TK","TM","TL","TO","TT","TN","TR","TV","TW","TZ","UG","UA","UM","UY","US","UZ","VA","VC","VE","VG","VI","VN","VU","WF","WS","YE","ZA","ZM","ZW"].map(code=>({code,name:names.of(code)})).sort((a,b)=>a.name.localeCompare(b.name));
const form=el("ballot"),picker=el("picker"),search=el("search"),list=el("list");
const endpoint="/.netlify/functions/cafe-poll",storageKey="glca-cafe-poll-v2";
let country="",saved={};
try{saved=JSON.parse(localStorage.getItem(storageKey)||"{}")||{}}catch{}
if(!saved.id)saved.id=crypto.randomUUID();
function save(){try{localStorage.setItem(storageKey,JSON.stringify(saved))}catch{}}
save();
function renderCountries(){
 const query=search.value.trim().toLowerCase();
 const matches=countries.filter(item=>item.name.toLowerCase().includes(query)||item.code.toLowerCase()===query);
 list.replaceChildren();
 for(const item of matches){
  const button=document.createElement("button");button.type="button";
  const icon=document.createElement("img");
  icon.src=flagImage(item.code);icon.alt="";icon.loading="lazy";icon.decoding="async";
  const label=document.createElement("span");label.textContent=item.name;
  button.setAttribute("aria-pressed",String(item.code===country));
  button.append(icon,label);
  button.addEventListener("click",()=>{country=item.code;const selected=icon.cloneNode();selected.loading="eager";el("pick").replaceChildren(selected,document.createTextNode(item.name));picker.close()});
  list.append(button);
 }
 if(!matches.length)list.textContent="No matches. Try another name.";
}
el("pick").onclick=()=>{search.value="";renderCountries();picker.showModal();search.focus()};
el("close").onclick=()=>picker.close();
search.addEventListener("input",renderCountries);
async function results(){
 el("results").hidden=false;
 try{
  const response=await fetch(endpoint,{cache:"no-store"});
  if(!response.ok)throw Error();
  const data=await response.json();
  el("totals").textContent=data.total+" ballots · Chicken Sandwich "+data.item.chicken+" · Loaded Fries "+data.item.fries+" · Meal "+data.special.meal+" · Dessert "+data.special.dessert;
  el("countries").textContent=Object.entries(data.country).sort((a,b)=>b[1]-a[1]).map(([code,count])=>flag(code)+" "+names.of(code)+" "+count).join(" · ");
 }catch{el("totals").textContent="Results are temporarily unavailable."}
}
el("refresh").onclick=results;
function counted(){form.hidden=true;const notice=document.createElement("h2");notice.textContent="Vote counted!";form.before(notice);results()}
if(saved.voted)counted();
form.addEventListener("submit",async event=>{
 event.preventDefault();
 if(!country){el("message").textContent="Choose your flag before submitting.";el("pick").focus();return}
 const button=el("submit");button.disabled=true;el("message").textContent="Submitting…";
 try{
  const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...Object.fromEntries(new FormData(form)),country,id:saved.id})});
  const data=await response.json();
  if(!response.ok)throw Error(data.error);
  saved.voted=true;save();counted();
 }catch(error){el("message").textContent=error.message||"Try again shortly."}
 finally{button.disabled=false}
});
</script></body></html>
