<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Become a Momentum partner. Give student-athletes access to high-school credit opportunities while creating a new revenue stream for your school or club.">
  <title>Momentum — Become a Partner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;600;700;800&family=League+Spartan:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" href="/assets/momentum-trophy-player-cutout.webp" as="image" type="image/webp">
  <link rel="stylesheet" href="/momentum-hero.css">
</head>
<body>
<main>
  <section class="momentum-hero" aria-labelledby="momentum-title">
    <img class="hero-background-athlete" src="/assets/momentum-upper-right-player.webp" width="1100" height="1218" alt="" aria-hidden="true" decoding="async">
    <div class="hero-content">
      <div class="brand" aria-label="Momentum">Momentum<span>/</span></div>
      <div class="intro">
        <p class="eyebrow"><span class="eyebrow-line" aria-hidden="true"></span> Schools <span class="slash">/</span> Clubs <span class="slash">/</span> A stronger tomorrow</p>
        <h1 id="momentum-title">Become a<br>Partner.</h1>
        <p class="hero-description">Join Momentum and give your student-athletes access to high-school credit opportunities while creating a new revenue stream for your school or club.</p>
      </div>
      <div class="word-stage">
        <div class="giant-title" aria-hidden="true"><span>MOMENTUM</span></div>
        <img class="hero-trophy" src="/assets/momentum-trophy-player-cutout.webp" width="1129" height="1393" alt="Student-athlete celebrating with a soccer championship trophy" fetchpriority="high" decoding="async">
      </div>
    </div>
  </section>
</main>
<script>
(()=>{
  const holder=document.querySelector('.giant-title');
  const word=holder?.querySelector('span');
  if(!holder||!word) return;
  let requestId=0;
  function fitWord(){
    cancelAnimationFrame(requestId);
    requestId=requestAnimationFrame(()=>{
      word.style.transform='none';
      const naturalWidth=word.getBoundingClientRect().width;
      if(naturalWidth) word.style.transform='scaleX('+holder.clientWidth/naturalWidth+')';
    });
  }
  fitWord();
  window.addEventListener('resize',fitWord,{passive:true});
  if(document.fonts) document.fonts.ready.then(fitWord);
})();
</script>
</body>
</html>
