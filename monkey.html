<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#111111" />
<title>Harry and the Bubbling Goo — Sandra Schoeber</title>
<meta name="author" content="Sandra Schoeber" />
<meta name="description" content="A digital children's book about listening and telling the truth, written by Sandra Schoeber." />
<style>
  :root {
    --bg: #111111;
    --panel: rgba(255,255,255,.08);
    --panel-border: rgba(255,255,255,.10);
    --paper: #f5efe3;
    --paper-2: #fbf8f2;
    --ink: #171717;
    --muted: #a7a7a7;
    --accent: #e7c08c;
    --radius: 22px;
  }

  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 0%, #242424 0, #151515 38%, #0b0b0b 100%);
    color: #fff;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  button {
    font: inherit;
  }

  .app {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 14px;
    padding: 18px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    min-height: 58px;
    padding: 10px 12px 10px 16px;
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    background: rgba(20,20,20,.72);
    backdrop-filter: blur(18px);
    box-shadow: 0 18px 45px rgba(0,0,0,.24);
  }

  .brand {
    min-width: 0;
  }

  .brand-title {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
  }

  .brand h1 {
    margin: 0;
    font-size: clamp(15px, 1.6vw, 21px);
    font-weight: 650;
    letter-spacing: -.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .brand .author {
    color: #b9b9b9;
    font-size: 12px;
    white-space: nowrap;
  }

  .brand p {
    margin: 3px 0 0;
    color: #8e8e8e;
    font-size: 11px;
    letter-spacing: .01em;
  }

  .actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .icon-btn {
    min-width: 40px;
    height: 40px;
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 12px;
    background: rgba(255,255,255,.07);
    color: #fff;
    cursor: pointer;
    display: inline-grid;
    place-items: center;
    padding: 0 12px;
    transition: .18s ease;
  }

  .icon-btn:hover {
    background: rgba(255,255,255,.13);
    transform: translateY(-1px);
  }

  .stage {
    min-height: 0;
    position: relative;
    display: grid;
    place-items: center;
    padding: 0 58px;
  }

  .book-shell {
    position: relative;
    width: min(94vw, 1440px);
    height: min(78vh, 900px);
    display: grid;
    place-items: center;
    perspective: 1800px;
  }

  .book {
    position: relative;
    display: grid;
    place-items: center;
    max-width: 100%;
    max-height: 100%;
    padding: 10px;
    border-radius: 24px;
    background: linear-gradient(145deg, #24201d, #151311);
    box-shadow:
      0 45px 110px rgba(0,0,0,.45),
      0 16px 36px rgba(0,0,0,.30),
      inset 0 0 0 1px rgba(255,255,255,.05);
  }

  .page-frame {
    position: relative;
    display: grid;
    place-items: center;
    overflow: hidden;
    border-radius: 16px;
    background: var(--paper);
    transform-origin: left center;
    transition: transform .42s cubic-bezier(.2,.75,.2,1), opacity .28s ease;
  }

  .page-frame.turning-next {
    transform: rotateY(-8deg) scale(.995);
    opacity: .78;
  }

  .page-frame.turning-prev {
    transform: rotateY(8deg) scale(.995);
    opacity: .78;
  }

  .page-frame img {
    display: block;
    width: auto;
    height: auto;
    max-width: min(100%, 1400px);
    max-height: calc(min(78vh, 900px) - 20px);
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
  }

  .cover-wrap {
    position: relative;
    display: inline-block;
  }

  .cover-wrap img {
    max-height: calc(min(78vh, 900px) - 20px);
    border-radius: 10px;
  }

  .cover-credit {
    position: absolute;
    left: 50%;
    bottom: 2.5%;
    transform: translateX(-50%);
    white-space: nowrap;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(245,239,227,.90);
    color: #1b1b1b;
    border: 1px solid rgba(0,0,0,.08);
    font-size: clamp(11px, 1vw, 14px);
    font-weight: 650;
    letter-spacing: .01em;
    box-shadow: 0 8px 22px rgba(0,0,0,.10);
    backdrop-filter: blur(7px);
  }

  .author-page {
    width: min(900px, 86vw);
    height: min(700px, calc(78vh - 20px));
    min-height: 420px;
    background:
      radial-gradient(circle at 80% 18%, rgba(212,174,123,.12), transparent 26%),
      linear-gradient(180deg, var(--paper-2), var(--paper));
    color: var(--ink);
    display: grid;
    grid-template-rows: 1fr auto;
    padding: clamp(34px, 5vw, 72px);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
  }

  .author-page::before {
    content: "";
    position: absolute;
    width: 220px;
    height: 220px;
    border: 1px solid rgba(25,25,25,.08);
    border-radius: 50%;
    top: -95px;
    right: -70px;
  }

  .author-page::after {
    content: "";
    position: absolute;
    width: 340px;
    height: 340px;
    border: 1px solid rgba(25,25,25,.06);
    border-radius: 50%;
    bottom: -220px;
    left: -120px;
  }

  .author-inner {
    align-self: center;
    max-width: 680px;
  }

  .eyebrow {
    margin: 0 0 16px;
    color: #8a6a46;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .18em;
  }

  .author-page h2 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(42px, 7vw, 82px);
    font-weight: 500;
    letter-spacing: -.04em;
    line-height: .95;
  }

  .author-page .line {
    width: 64px;
    height: 2px;
    margin: 28px 0;
    background: #c69e6b;
  }

  .author-page .placeholder {
    margin: 0;
    max-width: 520px;
    color: #6c655c;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(17px, 2vw, 23px);
    line-height: 1.55;
  }

  .author-footer {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 20px;
    color: #857c71;
    font-size: 12px;
  }

  .endmark {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    color: #2d2a25;
  }

  .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 66px;
    border: 1px solid rgba(255,255,255,.11);
    border-radius: 16px;
    background: rgba(18,18,18,.72);
    color: #fff;
    backdrop-filter: blur(12px);
    box-shadow: 0 12px 30px rgba(0,0,0,.24);
    display: grid;
    place-items: center;
    font-size: 27px;
    cursor: pointer;
    transition: .18s ease;
    z-index: 5;
  }

  .nav:hover {
    background: rgba(255,255,255,.12);
    transform: translateY(-50%) scale(1.03);
  }

  .nav:disabled {
    opacity: .22;
    cursor: default;
  }

  .nav.prev { left: 0; }
  .nav.next { right: 0; }

  .footer {
    min-height: 54px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 14px;
    padding: 10px 14px;
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    background: rgba(20,20,20,.72);
    backdrop-filter: blur(18px);
  }

  .footer-left {
    color: #777;
    font-size: 11px;
  }

  .page-label {
    font-size: 12px;
    font-weight: 650;
    color: #e6e6e6;
    text-align: center;
    min-width: 120px;
  }

  .progress {
    justify-self: end;
    width: min(290px, 28vw);
    height: 5px;
    border-radius: 999px;
    overflow: hidden;
    background: rgba(255,255,255,.10);
  }

  .progress > span {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #caa26f, #f0d2a6);
    transition: width .3s ease;
  }

  .swipe-hint {
    position: absolute;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    padding: 7px 11px;
    border-radius: 999px;
    background: rgba(12,12,12,.74);
    border: 1px solid rgba(255,255,255,.08);
    color: #ddd;
    font-size: 11px;
    opacity: 0;
    pointer-events: none;
    animation: hint 3.7s ease 1.2s 1;
  }

  @keyframes hint {
    0%,100% { opacity:0; transform:translate(-50%, 4px); }
    15%,78% { opacity:1; transform:translate(-50%, 0); }
  }

  @media (max-width: 760px) {
    .app { padding: 10px; gap: 9px; }
    .brand p, .brand .author { display: none; }
    .actions .text-btn { display: none; }
    .stage { padding: 0 34px; }
    .book { padding: 6px; border-radius: 15px; }
    .page-frame { border-radius: 10px; }
    .page-frame img, .cover-wrap img {
      max-height: calc(100vh - 150px);
    }
    .nav { width: 35px; height: 52px; border-radius: 12px; font-size: 22px; }
    .footer { grid-template-columns: 1fr auto; }
    .progress { display: none; }
    .footer-left { font-size: 10px; }
    .author-page {
      width: min(88vw, 700px);
      height: min(70vh, 620px);
      min-height: 360px;
      padding: 34px 28px;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-title">
        <h1>Harry and the Bubbling Goo</h1>
        <span class="author">by Sandra Schoeber</span>
      </div>
      <p>A story about listening and telling the truth</p>
    </div>

    <div class="actions">
      <button class="icon-btn text-btn" id="restartBtn" title="Back to cover">Restart</button>
      <button class="icon-btn text-btn" id="autoBtn" title="Automatically turn pages">Auto</button>
      <button class="icon-btn" id="fullBtn" title="Fullscreen">⛶</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <button class="nav prev" id="prevBtn" aria-label="Previous page">‹</button>

    <div class="book-shell">
      <div class="book">
        <div class="page-frame" id="pageFrame"></div>
      </div>
    </div>

    <button class="nav next" id="nextBtn" aria-label="Next page">›</button>
    <div class="swipe-hint">Swipe or use the arrow keys to turn pages</div>
  </main>

  <footer class="footer">
    <div class="footer-left">Digital edition · Sandra Schoeber</div>
    <div class="page-label" id="pageLabel">Cover</div>
    <div class="progress"><span id="progressBar"></span></div>
  </footer>
</div>
