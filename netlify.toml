[build]
  command = "npm run build"

[functions]
  node_bundler = "esbuild"

# Serve the café landing page at the root of its future custom subdomain.
# This is a 200 rewrite: the browser keeps cafe.bimlabsstudio.com.
[[redirects]]
  from = "https://cafe.bimlabsstudio.com/"
  to = "/cafe.html"
  status = 200
  force = true

[[redirects]]
  from = "/checkout"
  to   = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/cafe-dessert"
  to = "/cafe-dessert.html"
  status = 200
